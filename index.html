<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soapbox</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="speaker.png" type="image/png" />
  </head>
  <body>
    <h1><span style="font-size: 1.3em">📣</span> Soapbox</h1>
    <p id="tagline">Say it louder. Or don't. We'll post it either way.</p>
  </h1>
  <p><a href="newuser.html">Create account</a></p>
  <form id="login-form">
      <label for="login-username">Username:</label>
      <input type="text" name="username" id="login-username" required>
      <label for="login-password">Password:</label>
      <input type="password" name="password" id="login-password" required>
      <button type="submit">Login</button>
  </form>
  <p id="login-status">Not logged in.</p>
  <button id="logout-button" type="button">Logout</button>
  <form id="new-post-form">
      <label for="post-body">Post body:</label>
      <textarea name="body" id="post-body" rows="5"></textarea>
      <button type="submit">POST</button>
  </form>
  <ul id="all-posts"></ul>
</body>
</html>
